name: Build & push image (GHCR)

# 用途：把 fork 里的 New API 源码构建成镜像，推到 ghcr.io/<你的账号>/new-api
# 服务器只负责 docker compose pull，不在服务器上编译。
#
# 触发方式：
#   1. push 到 main          -> 构建 custom-<sha7> + latest
#   2. push 标签 v*           -> 构建 v* 并打同名 tag
#   3. Actions 页面手动运行    -> 可自定义版本号

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号（留空则自动用 custom-<sha7>）'
        required: false
        type: string

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/new-api

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Dockerfile 会把 VERSION 文件的内容编译进二进制（common.Version），
      # 上游是在 release 流水线里写入 tag 的，这里必须补上，否则版本号为空。
      - name: 计算版本并写入 VERSION
        id: ver
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.version || '' }}"
          if [ -n "$INPUT" ]; then
            V="$INPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF#refs/tags/}"
          else
            V="custom-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          fi
          echo "$V" > VERSION
          SHA7=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "sha7=$SHA7" >> "$GITHUB_OUTPUT"
          echo "本次构建版本: $V"

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=sha-${{ steps.ver.outputs.sha7 }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          # 服务器是 x86_64，只构建 amd64 以缩短时间（约 5-8 分钟）。
          # 需要 arm64 时把下面两行改成矩阵构建，参考上游 docker-build.yml。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 关闭 provenance 附加层，避免部分旧版 docker pull 解析失败
          provenance: false

      - name: 输出摘要
        run: |
          {
            echo "### 镜像已推送"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "版本: ${{ steps.ver.outputs.version }}"
          } >> "$GITHUB_STEP_SUMMARY"
